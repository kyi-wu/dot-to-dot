<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Style Playground</title>

    <link
        rel="stylesheet"
        href="style-playground.css"
    >

</head>


<body>


<div class="playground-container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="playground-header">

        <div>

            <h1>
                ✦ Style Playground
            </h1>

            <p>
                Experiment with the visual style of your game.
            </p>

        </div>


        <button id="resetButton">
            Reset
        </button>

    </header>



    <!-- =====================================
         MAIN LAYOUT
    ====================================== -->

    <main class="playground-layout">


        <!-- =================================
             PREVIEW
        ================================== -->

        <section class="preview-section">


            <div
                id="gamePreview"
                class="game-preview"
            >


                <!-- =========================
                     DECORATIONS
                ========================== -->

                <div class="decoration decoration-1">
                    ✦
                </div>

                <div class="decoration decoration-2">
                    ✧
                </div>

                <div class="decoration decoration-3">
                    ✿
                </div>


                <!-- =========================
                     TITLE
                ========================== -->

                <div class="preview-title">
                    A Little Mystery
                </div>



                <!-- =========================
                     GAME AREA
                ========================== -->

                <div
                    id="gameArea"
                    class="game-area"
                >


                    <!-- -------------------------
                         INITIAL BACKGROUND
                    -------------------------- -->

                    <div
                        id="backgroundLayer"
                        class="background-layer"
                    >

                        <img
                            id="gameBackground"
                            class="game-background"
                            src=""
                            alt=""
                        >

                    </div>



                    <!-- -------------------------
                         REVEAL IMAGE
                    -------------------------- -->

                    <div
                        id="revealLayer"
                        class="reveal-layer"
                    >

                        <img
                            id="revealImage"
                            class="reveal-image"
                            src=""
                            alt=""
                        >

                    </div>



                    <!-- -------------------------
                         SVG GAME LAYER
                    -------------------------- -->

                    <svg
                        id="previewSvg"
                        viewBox="0 0 800 600"
                        preserveAspectRatio="xMidYMid meet"
                    >


                        <!-- =====================
                             CONNECTION LINES
                        ====================== -->

                        <line
                            class="preview-line"
                            x1="180"
                            y1="250"
                            x2="300"
                            y2="180"
                        />

                        <line
                            class="preview-line"
                            x1="300"
                            y1="180"
                            x2="430"
                            y2="230"
                        />

                        <line
                            class="preview-line"
                            x1="430"
                            y1="230"
                            x2="520"
                            y2="340"
                        />



                        <!-- =====================
                             POINT 1
                        ====================== -->

                        <g
                            class="preview-point"
                            transform="translate(180 250)"
                        >

                            <circle
                                class="point-shape"
                                r="14"
                            />

                            <text
                                class="point-number"
                                y="5"
                            >
                                1
                            </text>

                        </g>



                        <!-- =====================
                             POINT 2
                        ====================== -->

                        <g
                            class="preview-point"
                            transform="translate(300 180)"
                        >

                            <circle
                                class="point-shape"
                                r="14"
                            />

                            <text
                                class="point-number"
                                y="5"
                            >
                                2
                            </text>

                        </g>



                        <!-- =====================
                             POINT 3
                        ====================== -->

                        <g
                            class="preview-point"
                            transform="translate(430 230)"
                        >

                            <circle
                                class="point-shape"
                                r="14"
                            />

                            <text
                                class="point-number"
                                y="5"
                            >
                                3
                            </text>

                        </g>



                        <!-- =====================
                             CURRENT POINT
                        ====================== -->

                        <g
                            class="preview-point current-point"
                            transform="translate(520 340)"
                        >

                            <circle
                                class="point-shape"
                                r="14"
                            />

                            <text
                                class="point-number"
                                y="5"
                            >
                                4
                            </text>

                        </g>


                    </svg>


                </div>



                <!-- =================================
                     DIALOGUE
                ================================== -->

                <div
                    id="dialogue"
                    class="dialogue"
                >


                    <div class="character">
                        🐱
                    </div>


                    <div class="dialogue-box">

                        <div class="speaker">
                            Cat
                        </div>


                        <div class="dialogue-text">
                            I wonder what is hiding here...
                        </div>


                        <button
                            class="dialogue-next"
                        >
                            →
                        </button>

                    </div>


                </div>


            </div>

        </section>



        <!-- =================================
             CONTROLS
        ================================== -->

        <aside class="controls-panel">



            <!-- =================================
                 POINT
            ================================== -->

            <section class="control-group">

                <h2>
                    ✦ Point
                </h2>


                <label>

                    Shape

                    <select id="pointShape">

                        <option value="circle">
                            Circle
                        </option>

                        <option value="star">
                            Star
                        </option>

                        <option value="diamond">
                            Diamond
                        </option>

                        <option value="heart">
                            Heart
                        </option>

                    </select>

                </label>


                <label>

                    Size

                    <input
                        id="pointSize"
                        type="range"
                        min="6"
                        max="25"
                        value="14"
                    >

                </label>


                <label>

                    Fill

                    <input
                        id="pointFill"
                        type="color"
                        value="#ffffff"
                    >

                </label>


                <label>

                    Border

                    <input
                        id="pointBorder"
                        type="color"
                        value="#333333"
                    >

                </label>

            </section>



            <!-- =================================
                 NUMBERS
            ================================== -->

            <section class="control-group">

                <h2>
                    # Numbers
                </h2>


                <label class="checkbox">

                    <input
                        id="showNumbers"
                        type="checkbox"
                        checked
                    >

                    Show numbers

                </label>


                <label>

                    Font size

                    <input
                        id="numberSize"
                        type="range"
                        min="8"
                        max="25"
                        value="14"
                    >

                </label>

            </section>



            <!-- =================================
                 LINE
            ================================== -->

            <section class="control-group">

                <h2>
                    ─ Line
                </h2>


                <label>

                    Style

                    <select id="lineStyle">

                        <option value="solid">
                            Solid
                        </option>

                        <option value="dashed">
                            Dashed
                        </option>

                        <option value="dotted">
                            Dotted
                        </option>

                    </select>

                </label>


                <label>

                    Width

                    <input
                        id="lineWidth"
                        type="range"
                        min="1"
                        max="10"
                        value="4"
                    >

                </label>


                <label>

                    Color

                    <input
                        id="lineColor"
                        type="color"
                        value="#4caf50"
                    >

                </label>

            </section>



            <!-- =================================
                 ANIMATION
            ================================== -->

            <section class="control-group">

                <h2>
                    ✨ Animation
                </h2>


                <label>

                    Current point

                    <select id="pointAnimation">

                        <option value="none">
                            None
                        </option>

                        <option value="pulse">
                            Pulse
                        </option>

                        <option value="bounce">
                            Bounce
                        </option>

                        <option value="spin">
                            Spin
                        </option>

                    </select>

                </label>

            </section>



            <!-- =================================
                 GAME AREA BACKGROUND
            ================================== -->

            <section class="control-group">

                <h2>
                    🖼️ Game Area
                </h2>


                <label>

                    Background Color

                    <input
                        id="gameAreaBackground"
                        type="color"
                        value="#f5f3ed"
                    >

                </label>


                <label>

                    Background Image

                    <input
                        id="backgroundImage"
                        type="file"
                        accept="image/*"
                    >

                </label>


                <label>

                    Image Fit

                    <select id="backgroundFit">

                        <option value="cover">
                            Cover
                        </option>

                        <option value="contain">
                            Contain
                        </option>

                        <option value="fill">
                            Stretch
                        </option>

                    </select>

                </label>


                <button
                    id="clearBackground"
                    class="secondary-button"
                >
                    Remove Background Image
                </button>

            </section>



            <!-- =================================
                 REVEAL IMAGE
            ================================== -->

            <section class="control-group">

                <h2>
                    ✨ Reveal Image
                </h2>


                <label>

                    Image

                    <input
                        id="revealImageInput"
                        type="file"
                        accept="image/*"
                    >

                </label>


                <label>

                    Image Fit

                    <select id="revealFit">

                        <option value="contain">
                            Contain
                        </option>

                        <option value="cover">
                            Cover
                        </option>

                        <option value="fill">
                            Stretch
                        </option>

                    </select>

                </label>


                <label>

                    Preview Opacity

                    <input
                        id="revealOpacity"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                    >

                </label>


                <button
                    id="clearReveal"
                    class="secondary-button"
                >
                    Remove Reveal Image
                </button>

            </section>



            <!-- =================================
                 FRAME
            ================================== -->

            <section class="control-group">

                <h2>
                    ☐ Frame
                </h2>


                <label>

                    Style

                    <select id="frameStyle">

                        <option value="simple">
                            Simple
                        </option>

                        <option value="rounded">
                            Rounded
                        </option>

                        <option value="dashed">
                            Dashed
                        </option>

                        <option value="handdrawn">
                            Hand Drawn
                        </option>

                    </select>

                </label>

            </section>



            <!-- =================================
                 DIALOGUE
            ================================== -->

            <section class="control-group">

                <h2>
                    💬 Dialogue
                </h2>


                <label class="checkbox">

                    <input
                        id="showDialogue"
                        type="checkbox"
                        checked
                    >

                    Show dialogue

                </label>


                <label>

                    Character

                    <input
                        id="character"
                        type="text"
                        value="🐱"
                        maxlength="3"
                    >

                </label>


                <label>

                    Speaker

                    <input
                        id="speaker"
                        type="text"
                        value="Cat"
                    >

                </label>


                <label>

                    Text

                    <textarea
                        id="dialogueText"
                    >I wonder what is hiding here...</textarea>

                </label>

            </section>



            <!-- =================================
                 EXPORT
            ================================== -->

            <section class="control-group export-group">

                <h2>
                    Export
                </h2>


                <button
                    id="exportButton"
                    class="export-button"
                >
                    Generate CSS
                </button>


                <textarea
                    id="exportOutput"
                    readonly
                ></textarea>


                <button
                    id="copyButton"
                >
                    Copy CSS
                </button>

            </section>


        </aside>


    </main>


</div>



<script src="style-playground.js"></script>

</body>

</html>
